# kb.toml — instance identity and per-instance configuration.
#
# This file is the ONLY home for per-instance data. The tooling (scripts/lint.py,
# the skills) reads everything it needs from here so the code stays byte-identical
# across KB instances and /sync-upstream can port template updates cleanly.
# Unlike .template/features.toml, this file persists after onboarding.

[kb]
slug = "mycoforge"
brand = "MycoForge"
description = "The LLM-wiki pattern itself: architecture, workflows, and the design of this template"

[template]
version = "0.4.1"                          # bumped by /sync-upstream
repo = "https://github.com/LukeMainwaring/mycoforge"
commit = ""                                # template commit last synced from; set by /sync-upstream (empty in the template itself)

[lint]
# Terms that recur across the wiki without a page of their own get flagged as
# concept candidates ("promote on recurrence"). A term is satisfied by any page
# whose title contains it (case-insensitive).
concept_candidate_terms = ["federation", "onboarding"]
# Pages you know you'll write but haven't yet — suppresses broken-link errors.
intentional_forward_links = ["Query Workflow", "Lint Workflow"]
# Status vocabulary for `[!claim]` callouts. `speculative` is what /connect files;
# a later source promotes it to supported or refutes it.
claim_statuses = ["supported", "contested", "superseded", "speculative"]
# Warn when a page's file mtime is more than N days newer than its `updated:`
# frontmatter (the maintainer forgot to bump it). 0 disables the check.
stale_after_days = 0

# sf:begin(media-capture)
[snippet]
# ASR-correction glossary applied by /snippet when carving transcript clips:
# "what the transcriber heard" = "what was actually said".
glossary = { "carpathy" = "Karpathy", "my co forge" = "MycoForge" }
# sf:end(media-capture)

# sf:begin(insight)
[scout]
# /scout reads this table; state between runs lives in staging/scout.md, not here.
# Free-text queries, searched broadly each run.
topics = [
  "LLM wiki agent-maintained markdown knowledge base",
  "AI-native company operating model",
  "self-improving AI systems closed feedback loop",
  "coding agent harness design skills hooks",
]
# Named sites and orgs checked every run. `why` is for the human reading this file.
watch = [
  { url = "https://www.anthropic.com/engineering", why = "Anthropic engineering blog: harness and agent design posts" },
  { url = "https://www.anthropic.com/news", why = "Anthropic news: Claude Code releases and playbooks" },
  { url = "https://openai.com/news/", why = "OpenAI blog: Codex and agent announcements" },
  { url = "https://learn.chatgpt.com/docs/changelog", why = "Codex changelog (merged with ChatGPT; old developers.openai.com URL redirects here)" },
  { url = "https://github.com/openai/codex/releases", why = "Codex CLI release notes: context management, memory, hooks and AGENTS.md trust changes land here, not on the changelog page" },
  { url = "https://developers.openai.com/blog/", why = "OpenAI developer blog: Codex ways-of-working posts; markdown twins at /blog/<slug>.md" },
  { url = "https://claude.dev/blog/", why = "Claude Code team blog: how-we-work posts and reference implementations (claude.com/blog mostly links here)" },
  { url = "https://www.ycombinator.com/blog", why = "YC blog and Lightcone: AI-native company practice" },
  { url = "https://www.youtube.com/@ycombinator", why = "YC YouTube: founder interviews on building with AI" },
  { url = "https://anchor.fm/s/8c1524bc/podcast/rss", why = "YC Startup Podcast RSS: every Lightcone and Startup School episode with an exact pubDate; better signal than the blog" },
  { url = "https://karpathy.bearblog.dev/", why = "Karpathy: origin of the LLM-wiki pattern" },
  { url = "https://github.com/garrytan/gbrain", why = "gbrain: agent memory layer that overlaps the wiki layer; watch releases" },
  { url = "https://github.com/search?q=llm+wiki+obsidian+claude+code&type=repositories&s=updated", why = "GitHub: new LLM-wiki and harness repos, most recently updated first" },
]
# Freshness filters. Articles count as fresh by published or visibly-updated date.
max_age_days = 60
repo_active_days = 30
# Window for a first run or when no ledger entry exists; `/scout 30d` overrides.
lookback_days = 90
# sf:end(insight)

# sf:begin(orchestrator)
[orchestrator]
# Optional back-pointer to a parent KB (relative path, "" for none).
parent = ""

# Zero or more child KBs — independent git repos nested inside this folder.
# Uncomment and repeat per child:
# [[orchestrator.children]]
# path = "relative/path/to/child"
# scope = "one-line description used for routing"
# sf:end(orchestrator)
